name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install sounddevice numpy webrtcvad httpx python-dotenv pyside6 pynput comtypes faster-whisper torch

      - name: Build with PyInstaller
        run: |
          pyinstaller vocis.spec

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\Vocis\* -DestinationPath Vocis.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocis
          path: dist/Vocis/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Vocis.zip
            dist/Vocis/Vocis.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
