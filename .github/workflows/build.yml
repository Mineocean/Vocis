name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install sounddevice numpy onnxruntime httpx python-dotenv pyside6 pynput comtypes faster-whisper

      - name: Build with PyInstaller
        run: |
          pyinstaller vocis.spec
          if (Test-Path dist\Vocis.exe) { echo "Build OK" } else { echo "Build FAILED"; exit 1 }

      - name: List build output
        run: Get-Item dist\Vocis.exe | Select-Object FullName, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocis
          path: dist/Vocis.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vocis.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
