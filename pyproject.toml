[project]
name = "vocis"
version = "0.2.0"
description = "Vocis — Real-time speech recognition + AI translation subtitle overlay"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "scipy>=1.12.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "pyside6>=6.8.0",
    "pynput>=1.7.7",
    "comtypes>=1.4.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0"]
gpu = ["torch>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
