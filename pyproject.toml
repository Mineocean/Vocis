[project]
name = "vocis"
version = "0.1.0"
description = "Vocis（声幕）—— 实时语音识别 + 翻译屏幕字幕"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5.1",
    "numpy>=1.26.0",
    "webrtcvad>=2.0.10",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "pyside6>=6.8.0",
    "pynput>=1.7.7",
    "comtypes>=1.4.0",
]
